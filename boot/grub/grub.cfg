set default=0
set timeout=-1
set pager=0

terminal_output console

echo ""
echo "  K   K  EEEEE  RRRR"
echo "  K  K   E      R   R"
echo "  KKK    EEEE   RRRR"
echo "  K  K   E      R  R"
echo "  K   K  EEEEE  R   R"
echo ""

menuentry "Manual Installation" --id kerynth-manual {
    linux /boot/vmlinuz kerynth.mode=installer-manual
    initrd /boot/initramfs.cpio.gz
}

menuentry "Automatic Installation" --id kerynth-automatic {
    linux /boot/vmlinuz kerynth.mode=installer-automatic
    initrd /boot/initramfs.cpio.gz
}

menuentry "Live System" --id kerynth-live {
    linux /boot/vmlinuz kerynth.mode=live
    initrd /boot/initramfs.cpio.gz
}
