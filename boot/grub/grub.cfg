set default=0
set timeout=-1
set pager=0

terminal_output console

echo ""
echo "  K   K  EEEEE  RRRR"
echo "  K  K   E      R   R"
echo "  KKK    EEEE   RRRR"
echo "  K  K   E      R  R"
echo "  K   K  EEEEE  R   R"
echo ""

menuentry "Manual Installation" --id kerynth-manual {
    probe --set=kerynth_media_uuid --fs-uuid ($root)
    linux /boot/vmlinuz kerynth.mode=installer-manual kerynth.media=UUID=$kerynth_media_uuid rootdelay=4
    initrd /boot/initramfs.cpio.gz
}

menuentry "Automatic Installation" --id kerynth-automatic {
    probe --set=kerynth_media_uuid --fs-uuid ($root)
    linux /boot/vmlinuz kerynth.mode=installer-automatic kerynth.media=UUID=$kerynth_media_uuid rootdelay=4
    initrd /boot/initramfs.cpio.gz
}

menuentry "Live System" --id kerynth-live {
    probe --set=kerynth_media_uuid --fs-uuid ($root)
    linux /boot/vmlinuz kerynth.mode=live kerynth.media=UUID=$kerynth_media_uuid rootdelay=4
    initrd /boot/initramfs.cpio.gz
}
