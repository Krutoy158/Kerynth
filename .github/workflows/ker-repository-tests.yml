name: Kerynth package repository tests

on:
  push:
    paths:
      - ".github/workflows/ker-repository-tests.yml"
      - "tools/ker-package"
      - "tools/ker-repository"
      - "tests/**"
      - "requirements-test.txt"
  pull_request:
    paths:
      - ".github/workflows/ker-repository-tests.yml"
      - "tools/ker-package"
      - "tools/ker-repository"
      - "tests/**"
      - "requirements-test.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile package tools
        run: python -m py_compile tools/ker-package tools/ker-repository
      - name: Run test suite
        run: python -m unittest discover -s tests -v
