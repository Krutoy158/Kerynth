name: Kerynth hardware module matching tests

on:
  push:
    paths:
      - ".github/workflows/hardware-module-tests.yml"
      - "tools/kerynth-hw"
      - "tests/test_hardware.py"
      - "requirements-test.txt"
  pull_request:
    paths:
      - ".github/workflows/hardware-module-tests.yml"
      - "tools/kerynth-hw"
      - "tests/test_hardware.py"
      - "requirements-test.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardware-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile hardware scanner
        run: python -m py_compile tools/kerynth-hw
      - name: Run hardware inventory tests
        run: python -m unittest discover -s tests -p 'test_hardware.py' -v
