name: Build tool

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate build configuration
        run: python3 tools/kerynth-build check
      - name: Install GRUB configuration checker
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-common
      - name: Validate GRUB menu syntax
        run: grub-script-check boot/grub/grub.cfg
      - name: Validate GRUB menu syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-common
          grub-script-check boot/grub/grub.cfg
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
