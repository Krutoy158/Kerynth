name: Build tool

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Validate build configuration
        run: python3 tools/kerynth-build check
      - name: Compile build pipeline Python
        run: python3 -m py_compile tools/kerynth-build-pipeline
      - name: Install GRUB configuration checker
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-common
      - name: Validate GRUB menu syntax
        run: grub-script-check boot/grub/grub.cfg
      - name: Build Kerynth Welcome Qt application
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake qt6-base-dev
          cmake -S desktop/welcome -B .kerynth-welcome-build -DCMAKE_BUILD_TYPE=Release
          cmake --build .kerynth-welcome-build --parallel 2
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
